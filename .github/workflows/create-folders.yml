name: Create Major Project 2022-2026 Folder Structure

on:
  workflow_dispatch:

jobs:
  create-folders:
    name: Generate Project Directory Structure
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Major Project Folder Structure
        run: |
          rm -rf "Major Project 2022-2026"

          for i in {1..23}; do
            mkdir -p "Major Project 2022-2026/CSM-A/A-$i"
            touch "Major Project 2022-2026/CSM-A/A-$i/README.md"

            mkdir -p "Major Project 2022-2026/CSM-B/B-$i"
            touch "Major Project 2022-2026/CSM-B/B-$i/README.md"

            mkdir -p "Major Project 2022-2026/CSM-C/C-$i"
            touch "Major Project 2022-2026/CSM-C/C-$i/README.md"

            mkdir -p "Major Project 2022-2026/CSM-D/D-$i"
            touch "Major Project 2022-2026/CSM-D/D-$i/README.md"
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create Major Project 2022-2026 folder structure for CSM-A, CSM-B, CSM-C, and CSM-D"
            git push
          fi
