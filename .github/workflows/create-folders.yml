name: Reorganize CSM Folders

on:
  workflow_dispatch:

jobs:
  reorganize:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reorganize folders
        run: |
          rm -rf "Industrial oriented mini project 2026-2027"

          for i in {1..23}; do
            mkdir -p "Industrial oriented mini project 2026-2027/CSM-A/A-$i"
            touch "Industrial oriented mini project 2026-2027/CSM-A/A-$i/.gitkeep"

            mkdir -p "Industrial oriented mini project 2026-2027/CSM-B/B-$i"
            touch "Industrial oriented mini project 2026-2027/CSM-B/B-$i/.gitkeep"

            mkdir -p "Industrial oriented mini project 2026-2027/CSM-C/C-$i"
            touch "Industrial oriented mini project 2026-2027/CSM-C/C-$i/.gitkeep"

            mkdir -p "Industrial oriented mini project 2026-2027/CSM-D/D-$i"
            touch "Industrial oriented mini project 2026-2027/CSM-D/D-$i/.gitkeep"
          done

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create Industrial oriented mini project 2026-2027 folders"
            git push
          fi
