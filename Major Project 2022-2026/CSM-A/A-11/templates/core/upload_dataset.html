{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen bg-blue-50 py-8">
    <div class="max-w-2xl mx-auto px-6">
        <div class="mb-6">
            <a href="{% url 'dashboard' %}" class="text-blue-600 hover:text-blue-900 flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Dashboard</span>
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-blue-200 p-8">
            <h2 class="text-2xl font-bold text-blue-600 mb-6">Upload Dataset</h2>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-6">
                    <label class="block text-sm font-medium text-blue-700 mb-3">Select CSV File</label>
                    <div class="border-2 border-dashed border-blue-300 rounded-lg p-8 text-center hover:border-blue-400 transition">
                        {{ form.file }}
                        <label for="file-upload" class="cursor-pointer flex flex-col items-center">
                            <svg class="w-12 h-12 text-blue-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="text-sm font-medium text-blue-700">Click to upload or drag and drop</p>
                            <p class="text-xs text-blue-600 mt-1">CSV files only</p>
                        </label>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <a href="{% url 'dashboard' %}" class="flex-1 px-4 py-3 border border-blue-300 text-blue-700 rounded-lg hover:bg-blue-50 transition text-center">
                        Cancel
                    </a>
                    <button type="submit" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-800 transition">
                        Upload
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('file-upload').addEventListener('change', function(e) {
    const fileName = e.target.files[0]?.name;
    if (fileName) {
        const label = this.nextElementSibling.querySelector('p');
        label.textContent = fileName;
    }
});
</script>
{% endblock %}
