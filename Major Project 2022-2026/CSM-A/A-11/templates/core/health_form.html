{% extends 'core/base.html' %}

{% block title %}Health Prediction Form - AIMed Prognosis{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Health Prediction Form</h1>
    
    <div class="bg-white p-8 rounded-lg shadow-md">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Age</label>
                {{ form.age }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">BMI</label>
                {{ form.bmi }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Blood Pressure</label>
                {{ form.blood_pressure }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Cholesterol</label>
                {{ form.cholesterol }}
            </div>
            
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 font-semibold">Get Prediction</button>
        </form>
    </div>
</div>
{% endblock %}
